services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hmc_support
      POSTGRES_USER: hmc
      POSTGRES_PASSWORD: hmc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmc -d hmc_support"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["6379:6379"]
  migrate:
    build: .
    env_file: ${ENV_FILE:?Set ENV_FILE to a local environment file}
    depends_on:
      postgres: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
  api:
    build: .
    env_file: ${ENV_FILE:?Set ENV_FILE to a local environment file}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    ports: ["8000:8000"]
volumes:
  postgres_data:
