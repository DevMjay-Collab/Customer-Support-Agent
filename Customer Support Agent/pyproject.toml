[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hmc-ai-support"
version = "0.1.0"
description = "Single-organization AI customer operations platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "asyncpg>=0.30,<1", "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3", "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6", "sqlalchemy>=2.0,<3", "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP031"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
